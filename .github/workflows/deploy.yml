name: Deploy to EC2

# 666 브랜치에 push되면 자동으로 EC2 서버에 SSH 접속해서
# git pull + docker compose up --build를 대신 실행해준다.
on:
  push:
    branches: ["666"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 EC2 접속해서 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/tep-project
            git pull origin 666
            docker compose up -d --build
